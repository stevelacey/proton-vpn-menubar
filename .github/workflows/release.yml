name: Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    name: Publish GitHub release
    runs-on: macos-latest
    permissions:
      contents: write
    outputs:
      url: ${{ steps.upload.outputs.url }}
    steps:
      - uses: actions/checkout@v6

      - name: Build a universal app
        run: |
          version="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" -c "Set :CFBundleVersion $version" Info.plist
          ./build --universal
          ditto -c -k --keepParent ".build/Proton VPN Menu Bar.app" "ProtonVPNMenuBar-$version.zip"

      - name: Create the release with the app
        id: upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "ProtonVPNMenuBar-$version.zip" --title "$GITHUB_REF_NAME" --generate-notes
          echo "url=https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/ProtonVPNMenuBar-$version.zip" >> "$GITHUB_OUTPUT"

  tap-publish:
    name: Publish to tap
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Trigger homebrew-tap update
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: stevelacey/homebrew-tap
          event-type: update-formula
          client-payload: >-
            {
              "formula": "proton-vpn-menubar",
              "url": "${{ needs.release.outputs.url }}",
              "version": "${{ github.ref_name }}"
            }
